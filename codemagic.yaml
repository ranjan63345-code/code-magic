workflows:
  flutter-android:
    name: Flutter Android
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release --split-per-abi
      - name: Email build to testing team
        script: python3 scripts/send_build_email.py
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - dhanushkumar@revolite.io
          - ranjanath@revolite.io
        notify:
          success: false
          failure: true
